name: MirrorMatch
options:
  bundleIdPrefix: ch.connexa
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: B97SQSQBMR
    CODE_SIGN_STYLE: Automatic
targets:
  MirrorMatch:
    type: application
    platform: iOS
    sources:
      - path: MirrorMatch
        excludes:
          - "**/*.storekit"
      - path: MirrorMatch/Store/Products.storekit
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.connexa.mirrormatch
        PRODUCT_NAME: MirrorMatch
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    info:
      path: MirrorMatch/Resources/Info.plist
      properties:
        CFBundleDisplayName: Mirror Match
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        CFBundleURLTypes:
          - CFBundleURLName: ch.connexa.mirrormatch
            CFBundleURLSchemes: [mirrormatch]
    scheme:
      storeKitConfiguration: MirrorMatch/Store/Products.storekit
